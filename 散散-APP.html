ng:20px 0;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:start}.timeline-item time{font-size:12px;color:var(--muted);width:65px;flex-shrink:0}.timeline-item button{text-align:left;padding:0}.timeline-item p{margin:0;font-family:'Noto Serif SC',serif;font-size:20px}.timeline-item small{color:var(--muted)}footer{font-size:10px;letter-spacing:1.4px;display:flex;justify-content:space-between;padding:38px 0 25px;margin-top:35px;border-top:1px solid var(--line);color:var(--muted)}.floating{position:fixed;right:32px;bottom:28px;width:57px;height:57px;border-radius:50%;font-size:32px;background:var(--orange);color:white;box-shadow:0 6px 22px #88331930;z-index:6}.toast{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);background:#30372d;color:white;padding:10px 24px;border-radius:4px;z-index:30;display:none;font-size:14px}dialog{border:1px solid var(--line);padding:30px;width:min(580px,calc(100vw - 28px));max-height:90dvh;background:var(--paper);color:var(--ink);box-shadow:0 20px 100px #0003}dialog::backdrop{background:#20241c66;backdrop-filter:blur(3px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;font-family:'Noto Serif SC',serif;font-size:23px;margin-bottom:20px}.icon{font:28px Arial;padding:0 5px}textarea{width:100%;min-height:170px;resize:vertical;background:none;border:0;outline:none;font-family:'Noto Serif SC',serif;font-size:22px;line-height:1.8}.form-row{display:flex;gap:16px;margin-top:17px}.form-row label{flex:1;min-width:0;font-size:12px;color:var(--muted)}select,.form-row input{display:block;width:100%;background:#faf8f1;border:1px solid var(--line);padding:10px 8px;margin-top:5px;font-size:14px;color:var(--ink)}.dialog-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:28px}.image-btn{font-size:14px;cursor:pointer}.form-note{font-size:12px;color:var(--muted)}#image-preview img{max-height:150px;max-width:100%}.detail-body{white-space:pre-wrap;font-family:'Noto Serif SC',serif;font-size:23px;overflow-wrap:anywhere;margin:25px 0}.detail-image{max-width:100%;max-height:320px;object-fit:contain}.detail-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.secondary{border:1px solid var(--line);padding:9px 16px;font-size:14px}.empty{padding:45px;text-align:center;border:1px dashed var(--line);color:var(--muted);grid-column:1/-1}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:1500px){.workspace{padding:0 80px}.cards{gap:28px}.card{min-height:280px}}@media(max-width:1100px){.sidebar{width:200px;padding:32px 22px}.workspace{margin-left:200px;padding:0 30px}.cards{grid-template-columns:1fr 1fr}.card:nth-child(3n+2){margin-top:0}.issue{display:none}h1{font-size:36px}}@media(max-width:700px){.sidebar{inset:auto 0 0;width:100%;height:73px;padding:0;border-right:0;border-top:1px solid var(--line);display:block}.brand,.edition,.side-note,.export,.local{display:none}nav{display:flex;height:100%;justify-content:space-around;gap:0}nav button{flex-direction:column;gap:0;font-size:11px;padding:8px 16px;border-radius:0}nav button.active{background:transparent;color:var(--orange)}nav .symbol{font-size:21px;text-align:center}nav small{display:none}.workspace{margin:0;padding:0 22px}header{height:66px;font-size:10px}.header-right{gap:8px;font-size:11px}.avatar{width:28px;height:28px;font-size:18px;line-height:28px}.intro{margin:28px 0 20px}h1{font-size:32px;letter-spacing:-1px}.eyebrow{font-size:10px}.sub{font-size:13px}.capture{padding:16px 14px;gap:10px;margin:24px 0}.capture button{padding:9px 12px;font-size:12px}.capture .asterisk{font-size:32px}.capture input{font-size:14px}.focus-list{grid-template-columns:1fr;gap:10px}.focus-task{padding:14px}.section-head{align-items:start;gap:10px;flex-wrap:wrap}.section-head h2 small{font-size:9px;margin-left:8px}.cards{gap:12px}.card{padding:17px;min-height:220px}.card h3{font-size:20px;margin:18px 0 12px}.card p{font-size:12px}.card img{width:calc(100% + 34px);margin:-17px -17px 15px;height:145px}.card-top{font-size:9px}.card-bottom{font-size:10px;flex-wrap:wrap;gap:5px}.card.life h3{font-size:19px}.filters{gap:0}.chip{font-size:12px;padding:4px 11px}.floating{bottom:91px;right:20px;width:50px;height:50px}.grid-quads{grid-template-columns:1fr;gap:15px}.quad{min-height:170px}.toast{bottom:95px;width:max-content;max-width:90vw}footer{padding-bottom:100px;font-size:8px;letter-spacing:.5px}dialog{padding:23px}.form-row{gap:10px}.timeline{padding-left:18px}.timeline-item{gap:12px}.timeline-item p{font-size:18px}}

<aside class="sidebar"><a class="brand" href="#" aria-label="散散首页">散散<span>scatter®</span></a><div class="edition">A LITTLE SPACE FOR YOUR MIND</div><nav id="nav"></nav><div class="side-note">想法不必完整，<br>生活也是。<span>MAKE ROOM FOR THE LITTLE THINGS.</span></div><button class="export" id="export">↗ 导出我的记录</button><div class="local">仅保存在此浏览器 · 含示例内容</div></aside>
<div class="workspace"><header><span id="date"></span><span class="header-right">你的私人生活切片 <i class="avatar">S</i></span></header><main id="main"></main><footer>SCATTER — PERSONAL COLLECTION <span>想到哪里，记到哪里。</span></footer></div><button class="floating" id="add" aria-label="新增记录">＋</button><div class="toast" id="toast" role="status"></div>
<dialog id="editor"><form id="form"><div class="dialog-head"><span id="editor-title">留住这一刻</span><button type="button" class="icon" id="close" aria-label="关闭">×</button></div><label class="sr" for="content">记录内容</label><textarea id="content" required placeholder="此刻，想留下什么？" maxlength="12000"></textarea><div id="image-preview"></div><div class="form-row"><label>放在哪里<select id="type"><option value="inbox">随手记</option><option value="idea">Idea 灵感</option><option value="life">生活片段</option><option value="task">待办</option></select></label><label id="priority-wrap">轻重缓急<select id="priority"><option value="0">现在做 · 重要且紧急</option><option value="1">慢慢推进 · 重要不紧急</option><option value="2">尽快处理 · 紧急不重要</option><option value="3">有空再说 · 不重要不紧急</option></select></label></div><div class="form-row"><label>标签<input id="tag" placeholder="摄影、旅行、日常" maxlength="100"></label><label id="due-wrap">计划日期<input id="due" type="date"></label></div><div class="dialog-bottom"><label class="image-btn">＋ 添加图片<input type="file" id="image" accept="image/*" hidden></label><button class="primary" type="submit">收好这份念头 ↗</button></div><p class="form-note">不分类也可以。内容只保存在当前浏览器。</p></form></dialog>
<dialog id="detail"><div id="detail-content"></div></dialog><script>const $=s=>document.querySelector(s),KEY='scatter-records-v1';
const labels={inbox:'随手记',idea:'Idea 灵感',life:'生活片段',task:'待办'},names=['现在做','慢慢推进','尽快处理','有空再说'],descs=['重要且紧急','重要不紧急','紧急不重要','不重要不紧急'];
const day=new Date().toISOString(),ago=n=>new Date(Date.now()-86400000*n).toISOString();
const seeds=[{id:'a',type:'idea',text:'开一家只在下雨天\n营业的咖啡店。\n\n菜单随着天气变化，晴天就出门收集新的故事。',tag:'奇思妙想',date:day},{id:'b',type:'life',text:'原来发呆，\n也算认真生活。\n\n下午三点，关掉消息，读了几页一直没读完的书。窗外刚好有风。',tag:'日常的小事',date:ago(1)},{id:'c',type:'idea',text:'给城市里的声音，\n做一本相册。\n\n便利店的开门声、雨滴落在遮阳棚上、末班地铁。试着用声音记住一座城。',tag:'摄影 / 创作',date:ago(2)},{id:'d',type:'inbox',text:'下次旅行，\n想坐一次慢火车。',tag:'旅行清单',date:ago(3)},{id:'e',type:'task',text:'把周五的方案整理好',priority:0,tag:'工作',date:day,done:false},{id:'f',type:'task',text:'给摄影计划留出半小时',priority:1,tag:'留给自己',date:day,done:false},{id:'g',type:'task',text:'去取楼下的快递',priority:2,tag:'生活',date:ago(1),done:false},{id:'h',type:'task',text:'整理那些舍不得删的截图',priority:3,tag:'日常',date:ago(2),done:false}];
let records;try{records=JSON.parse(localStorage.getItem(KEY))||seeds}catch{records=seeds}let page='home',filter='all',query='',editing=null,imageData='',showDone=false;const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').style.display='none',2600)}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));records=next;return true}catch{notify('保存空间不足，请减少图片或先导出记录。');return false}}
function dateLabel(d){return new Date(d).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}).replace('/','.')}function go(p){page=p;filter='all';query='';render();window.scrollTo(0,0)}
function card(r,i){let parts=r.text.split('\n\n');return `<button class="card ${esc(r.type)}" data-open="${esc(r.id)}">${r.image?`<img src="${r.image}" alt="记录中的图片">`:''}<div class="card-top"><span>${r.type==='idea'?'✳ IDEA':r.type==='life'?'◈ LIFE NOTES':r.type==='inbox'?'↳ INBOX':'↗ TO DO'}</span><span class="number">${String(i+1).padStart(2,'0')}</span></div><h3>${esc(parts[0].slice(0,100))}</h3>${parts[1]?`<p>${esc(parts.slice(1).join('\n').slice(0,100))}</p>`:''}<div class="card-bottom"><span>${r.tag?'# '+esc(r.tag):labels[r.type]}</span><time>${dateLabel(r.date)}</time></div></button>`}
function intro(ey,title,sub){return `<div class="intro"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="sub">${sub}</p></div><span class="issue">a collection of little things.</span></div>`}
function chips(){return `<div class="filters">${[['all','全部'],['idea','灵感'],['life','生活'],['inbox','随手记']].map(([v,l])=>`<button class="chip ${filter===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}</div>`}
function listing(){let rs=records.filter(r=>r.type!=='task'&&(filter==='all'||r.type===filter)&&(!query||(r.text+' '+r.tag).toLowerCase().includes(query.toLowerCase())));return rs.length?rs.map(card).join(''):'<div class="empty">这里还空着，留下第一个念头吧。</div>'}
function focus(r){return `<div class="focus-task"><button class="check" data-check="${r.id}" aria-label="完成：${esc(r.text)}"></button><button class="task-text" data-open="${r.id}" style="text-align:left;padding:0"><span>${esc(r.text)}</span><small><i class="dot" style="background:${r.priority===0?'#c94c31':'#778767'}"></i>${names[r.priority]}${r.due?' · '+esc(r.due):''}</small></button><span class="quiet">↗</span></div>`}
function render(){ $('#date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('#nav').innerHTML=[['home','⌂','此刻'],['shelf','▦','收藏架'],['tasks','☷','待办'],['review','◷','回顾']].map(([v,i,l])=>`<button data-page="${v}" class="${page===v?'active':''}"><span class="symbol">${i}</span>${l}${v==='shelf'?`<small>${records.filter(r=>r.type!=='task').length}</small>`:''}</button>`).join('');let html='';
if(page==='home'){html=intro('YOUR MIND, A LITTLE LIGHTER','今天，先留住一个<em>念头。</em>','不必整理好再出发。一句话，也值得被收好。')+`<form class="capture" id="quick"><span class="asterisk">✳</span><input id="quick-input" aria-label="快速记录" placeholder="脑袋里又冒出了什么？" maxlength="12000" required><button>记下来 ↗</button></form><div class="section-head"><h2>今天想推进 <small>A LITTLE PROGRESS</small></h2><button class="quiet" data-page="tasks">看看所有待办 ↗</button></div><div class="focus-list">${records.filter(r=>r.type==='task'&&!r.done).sort((a,b)=>a.priority-b.priority).slice(0,2).map(focus).join('')||'<div class="empty">今天，给自己留一点空白。</div>'}</div><div class="section-head"><h2>最近留下的 <small>RECENT FINDS</small></h2>${chips()}</div><div class="cards" id="cards">${listing()}</div>`}
if(page==='shelf'){html=intro('THE PERSONAL COLLECTION','把喜欢的，<em>都收好。</em>','那些还没成形的灵感，和不想忘记的日常。')+`<div class="search"><input id="search" aria-label="搜索记录" placeholder="找一段文字、一个标签……" value="${esc(query)}"><button class="secondary" id="new-shelf">＋ 新记录</button></div><div class="section-head">${chips()}<span class="quiet">${records.filter(r=>r.type!=='task').length} 个生活切片</span></div><div class="cards" id="cards">${listing()}</div>`}
if(page==='tasks'){html=intro('ONE SMALL STEP AT A TIME','慢慢来，<em>也在往前。</em>','按轻重缓急，给每件事一个合适的位置。')+`<div class="section-head"><span class="quiet">${records.filter(r=>r.type==='task'&&!r.done).length} 件待办 · ${records.filter(r=>r.type==='task'&&r.done).length} 件已完成</span><button class="chip ${showDone?'active':''}" id="done-toggle">${showDone?'隐藏已完成':'显示已完成'}</button></div><div class="grid-quads">${names.map((name,i)=>`<section class="quad"><h2>${String(i+1).padStart(2,'0')} / ${name}</h2><p class="sub">${descs[i]}</p>${records.filter(r=>r.type==='task'&&r.priority===i&&(showDone||!r.done)).map(r=>`<div class="quad-row ${r.done?'completed':''}"><button class="check ${r.done?'done':''}" data-check="${r.id}" aria-label="${r.done?'取消完成':'完成'}：${esc(r.text)}">${r.done?'✓':''}</button><button class="open-task" data-open="${r.id}">${esc(r.text)}${r.due?`<br><small class="quiet">${esc(r.due)}</small>`:''}</button></div>`).join('')}<button class="quad-add" data-new-task="${i}">＋ 添一件小事</button></section>`).join('')}</div>`}
if(page==='review'){let rs=[...records].sort((a,b)=>b.date.localeCompare(a.date));html=intro('LITTLE THINGS ADD UP','原来，已经留下<em>这么多。</em>','没有白过的一天，只有还没被发现的小事。')+`<div class="section-head"><span class="quiet">${records.length} 份记录，都是生活的证据。</span><button class="secondary" id="random">✳ 随便翻翻</button></div><div class="timeline">${rs.map(r=>`<div class="timeline-item"><time>${dateLabel(r.date)}</time><button data-open="${r.id}"><small>${labels[r.type]} ${r.done?' · 已完成':''}</small><p>${esc(r.text.split('\n')[0])}</p></button></div>`).join('')||'<p class="empty">从今天的第一条记录开始。</p>'}</div>`}
$('#main').innerHTML=html;if($('#quick'))$('#quick').onsubmit=e=>{e.preventDefault();const value=$('#quick-input').value.trim();if(!value)return;if(addRecord({text:value,type:'inbox',tag:''})){render();notify('记下了，之后再慢慢整理。')}};if($('#search'))$('#search').oninput=e=>{query=e.target.value;$('#cards').innerHTML=listing()};}
function addRecord(data){const r={id:crypto.randomUUID(),date:new Date().toISOString(),done:false,...data};return persist([r,...records])?r:null}
function openEditor(r=null,type='inbox',priority=0){editing=r?.id||null;imageData=r?.image||'';$('#form').reset();$('#editor-title').textContent=r?'整理这份念头':'留住这一刻';$('#content').value=r?.text||'';$('#type').value=r?.type||type;$('#priority').value=r?.priority??priority;$('#tag').value=r?.tag||'';$('#due').value=r?.due||'';updateType();updateImage();if(!r){try{const d=JSON.parse(localStorage.getItem('scatter-draft'));if(d){$('#content').value=d.text||'';$('#tag').value=d.tag||''}}catch{}}$('#editor').showModal();$('#content').focus()}
function updateType(){const task=$('#type').value==='task';$('#priority-wrap').style.display=task?'block':'none';$('#due-wrap').style.display=task?'block':'none'}function updateImage(){$('#image-preview').innerHTML=imageData?`<img src="${imageData}" alt="待保存图片"><button type="button" id="remove-image" class="quiet">移除图片</button>`:''}
function detail(id){const r=records.find(x=>x.id===id);if(!r)return;$('#detail-content').innerHTML=`<div class="dialog-head"><span>${labels[r.type]}</span><button class="icon" data-close-detail aria-label="关闭">×</button></div><div class="quiet">${dateLabel(r.date)} ${r.tag?' · # '+esc(r.tag):''}</div>${r.image?`<img class="detail-image" src="${r.image}" alt="记录中的图片">`:''}<div class="detail-body">${esc(r.text)}</div>${r.type==='task'?`<p class="quiet">${names[r.priority]}${r.due?' · '+esc(r.due):''}${r.done?' · 已完成':''}</p>`:''}<div class="detail-actions"><button class="secondary" data-edit="${id}">编辑 / 分类</button>${r.type==='idea'?`<button class="primary" data-convert="${id}">开始尝试 ↗</button>`:''}${r.type==='task'?`<button class="primary" data-detail-check="${id}">${r.done?'重新打开':'完成这件事 ✓'}</button>`:''}<button class="quiet" data-delete="${id}">删除记录</button></div>`;if(!$('#detail').open)$('#detail').showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.page)go(d.page);if(d.filter){filter=d.filter;render()}if(d.open)detail(d.open);if(d.check){if(persist(records.map(r=>r.id===d.check?{...r,done:!r.done}:r)))render()}if(d.newTask!==undefined)openEditor(null,'task',Number(d.newTask));if(d.closeDetail!==undefined)$('#detail').close();if(d.edit){$('#detail').close();openEditor(records.find(r=>r.id===d.edit))}if(d.detailCheck){if(persist(records.map(r=>r.id===d.detailCheck?{...r,done:!r.done}:r))){detail(d.detailCheck);render()}}if(d.convert){let r=records.find(r=>r.id===d.convert);$('#detail').close();openEditor(null,'task',1);$('#content').value='第一步：'+r.text.split('\n')[0];$('#tag').value=r.tag;$('#form').dataset.source=r.id}if(d.delete){if(confirm('删除这条记录？删除后可以立即撤销。')){const deleted=records.find(r=>r.id===d.delete);if(persist(records.filter(r=>r.id!==d.delete))){$('#detail').close();render();notify('已删除');$('#toast').innerHTML='已删除 <button id="undo" style="color:#fff;text-decoration:underline">撤销</button>';$('#undo').onclick=()=>{persist([deleted,...records]);render();notify('已恢复')}}}}if(b.id==='done-toggle'){showDone=!showDone;render()}if(b.id==='random'){if(records.length)detail(records[Math.floor(Math.random()*records.length)].id);else notify('先留下一条记录吧。')}if(b.id==='new-shelf'||b.id==='add')openEditor();if(b.id==='remove-image'){imageData='';updateImage()}});
$('#close').onclick=()=>$('#editor').close();$('#type').onchange=updateType;$('#content').oninput=$('#tag').oninput=()=>{if(!editing)try{localStorage.setItem('scatter-draft',JSON.stringify({text:$('#content').value,tag:$('#tag').value}))}catch{}};
$('#image').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!/^image\//.test(file.type)||file.size>3*1024*1024){notify('请选择 3 MB 以内的图片。');return}const reader=new FileReader();reader.onload=()=>{imageData=reader.result;updateImage()};reader.readAsDataURL(file)};
$('#form').onsubmit=e=>{e.preventDefault();const text=$('#content').value.trim();if(!text){notify('先写下一点内容吧。');return}const data={text,type:$('#type').value,tag:$('#tag').value.trim(),image:imageData,priority:Number($('#priority').value),due:$('#due').value};if($('#form').dataset.source)data.sourceId=$('#form').dataset.source;let ok=editing?persist(records.map(r=>r.id===editing?{...r,...data}:r)):addRecord(data);if(ok){if(!editing)try{localStorage.removeItem('scatter-draft')}catch{}delete $('#form').dataset.source;$('#editor').close();render();notify('收好了。')}};
$('#editor').addEventListener('close',()=>delete $('#form').dataset.source);$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='散散-我的记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('记录已导出。')};
render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'create_scatter_record',description:'创建本机保存的随手记录并刷新页面',inputSchema:{type:'object',properties:{text:{type:'string'},type:{type:'string',enum:['inbox','idea','life']}},required:['text'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:input=>{if(typeof input?.text!=='string'||!input.text.trim()||input.text.length>12000||input.type&&!['inbox','idea','life'].includes(input.type))throw new Error('无效记录');let r=addRecord({text:input.text.trim(),type:input.type||'inbox',tag:''});if(!r)throw new Error('保存失败');render();return{id:r.id,type:r.type}}})).catch(()=>{})}catch{}}
</script></body></html>
